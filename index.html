<!DOCTYPE html>
<html>
<head>

  <title>스고체크리스트</title>

  <link rel="icon" type="image/x-icon" href="red.ico">

  <!--stylesheets-->
  <link rel="stylesheet" href="css/style.css" type="text/css" media="all" />
  <link rel="stylesheet" href="css/flairs.css" type="text/css" media="all" />


  <!--scripts-->
  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script type="text/javascript" src="js/flairs.js"></script>
  <script type="text/javascript" src="js/scripts.js"></script>
  <script type="text/javascript" src="js/dom-to-image.js"></script>
  <script src="js/FileSaver.js"></script>
  <script src="js/lz-string.js"></script>

  <!--meta-->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="antonlabz">
  <meta name="description" content="OPTC 한국어 레전드 캐릭터 체크리스트">
</head>

<body>
  <noscript>이 페이지를 사용하려면 JavaScript를 활성화해야 합니다.</noscript>

  <div class="header"></div>
  <div class="update-note">한국어 DB 기준 최신 ★6/★6+ 캐릭터 체크리스트 · 캐릭터에 마우스를 올리면 이름과 번호가 표시됩니다.</div>
  <div class="counter-row" aria-label="체크리스트 현황">
    <span id="counter2" class="counter-item"></span>
    <span id="rainbow" class="counter-item"></span>
    <span id="srainbow" class="counter-item"></span>
  </div>

  <div class="buttons">
    <button id="select-all">전체선택</button>
    <button id="select-none">초기화</button>
    <button id="show-base">초진화 캐릭터 표시</button>
    <button id="hide-base">초진화 목록에서 제거</button>
    <button id="show-hidden">지운 캐릭터 복구</button>
    <button id="list-hidden">지운 캐릭터 목록</button>
    <button id="generate" onclick="generateImage()">이미지로 추출</button>
    <button onclick="toggleModal3()">가져오기/내보내기</button>
  </div>

  <div class="modal">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-text">이미지로 추출</span>
        <button id="image-download" onclick="download()">이미지 다운로드</button>
        <p><i>(또는 이미지에서 <code>우클릭 &gt; 복사</code>)</i></p>
        <span class="close-btn">&times;</span>
      </div>
      <div class="modal-content"></div>
    </div>
  </div>

  <div class="modal2">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-text">지운 캐릭터 목록</span>
        <p><i>(복구할 캐릭터 아이콘을 클릭하세요)</i></p>
        <span class="close-btn2">&times;</span>
      </div>
      <div class="modal-content2"></div>
    </div>
  </div>

  <div class="modal3">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-text">체크리스트 가져오기/내보내기</span>
        <span class="close-btn3">&times;</span>
      </div>
      <div class="modal-content3">
        <p class="warning">주의: 가져오기를 실행하면 현재 체크리스트를 덮어씁니다.</p>
        <button id="import" onclick="toggleImport()">체크리스트 가져오기</button>
        <button id="export" onclick="exportSelection()">체크리스트 내보내기</button>
        <input type="text" id="import-text" aria-label="가져올 체크리스트 데이터"><button id="apply-import" onclick="importSelection()">적용</button>
        <input type="text" id="export-text" aria-label="내보낼 체크리스트 데이터" onclick="this.setSelectionRange(0, this.value.length)"><button id="copy-export" onclick="copySelection()">복사</button>
        <div id="display-copied">클립보드에 복사했습니다.</div>
        <div id="imported">체크리스트를 가져왔습니다.</div>
        <div id="undefined">올바르지 않은 데이터입니다. 다시 내보내 주세요.</div>
      </div>
    </div>
  </div>

  <div class="container2">
    <div class="mode-controls">
      <label class="mode-control">
        <input id="switch" type="checkbox">
        <span class="slider round"></span>
        <span class="mode-text">무지개</span>
      </label>

      <label class="mode-control">
        <input id="switch2" type="checkbox">
        <span class="slider round"></span>
        <span class="mode-text">초무지개</span>
      </label>

      <label class="mode-control">
        <input id="check4" type="checkbox">
        <span class="slider round"></span>
        <span class="mode-text">레벨상한돌파</span>
      </label>

      <label class="mode-control">
        <input id="hide-legends" type="checkbox">
        <span class="slider round"></span>
        <span class="mode-text">목록에서 캐릭터 제거</span>
      </label>
    </div>

      <div class="icon-container">
        <div id="special"></div>
      </div>
  </div>

</body>

</html>
