<!DOCTYPE html>
<html>
<head>

  <title>스고체크리스트</title>

  <link rel="icon" type="image/x-icon" href="red.ico">

  <!--stylesheets-->
  <link rel="stylesheet" href="css/style.css?v=20260804" type="text/css" media="all" />
  <link rel="stylesheet" href="css/flairs.css?v=20260804-key" type="text/css" media="all" />


  <!--scripts-->
  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <script>
    // Keep the checklist working even if the external library is unavailable.
    if (!window.jQuery) {
      document.write('<script src="js/jquery.min.js"><\/script>');
    }
  </script>
  <script type="text/javascript" src="js/flairs.js?v=20260804-key"></script>
  <script type="text/javascript" src="js/scripts.js?v=20260804-key"></script>
  <script type="text/javascript" src="js/dom-to-image.js"></script>
  <script src="js/FileSaver.js"></script>
  <script src="js/lz-string.js"></script>

  <!--meta-->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="antonlabz">
  <meta name="description" content="OPTC 한국어 레전드 캐릭터 체크리스트">
</head>

<body>
  <noscript>이 페이지를 사용하려면 JavaScript를 활성화해야 합니다.</noscript>

  <div class="header"></div>
  <div class="buttons">
    <button id="select-all">전체선택</button>
    <button id="select-none">초기화</button>
    <button id="show-base">초진화 캐릭터 표시</button>
    <button id="hide-base">초진화 목록에서 제거</button>
    <button id="show-hidden">지운 캐릭터 복구</button>
    <button id="list-hidden">지운 캐릭터 목록</button>
    <button id="generate" onclick="generateImage()">이미지로 추출</button>
    <button onclick="toggleModal3()">가져오기/내보내기</button>
  </div>

  <div class="modal">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-text">이미지로 추출</span>
        <button id="image-download" onclick="download()">이미지 다운로드</button>
        <p><i>(또는 이미지에서 <code>우클릭 &gt; 복사</code>)</i></p>
        <span class="close-btn">&times;</span>
      </div>
      <div class="modal-content"></div>
    </div>
  </div>

  <div class="modal2">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-text">지운 캐릭터 목록</span>
        <p><i>(복구할 캐릭터 아이콘을 클릭하세요)</i></p>
        <span class="close-btn2">&times;</span>
      </div>
      <div class="modal-content2"></div>
    </div>
  </div>

  <div class="modal3">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-text">체크리스트 가져오기/내보내기</span>
        <span class="close-btn3">&times;</span>
      </div>
      <div class="modal-content3">
        <p class="warning">주의: 가져오기를 실행하면 현재 체크리스트를 덮어씁니다.</p>
        <button id="import" onclick="toggleImport()">체크리스트 가져오기</button>
        <button id="export" onclick="exportSelection()">체크리스트 내보내기</button>
        <input type="text" id="import-text" aria-label="가져올 체크리스트 데이터"><button id="apply-import" onclick="importSelection()">적용</button>
        <input type="text" id="export-text" aria-label="내보낼 체크리스트 데이터" onclick="this.setSelectionRange(0, this.value.length)"><button id="copy-export" onclick="copySelection()">복사</button>
        <div id="display-copied">클립보드에 복사했습니다.</div>
        <div id="imported">체크리스트를 가져왔습니다.</div>
        <div id="undefined">올바르지 않은 데이터입니다. 다시 내보내 주세요.</div>
      </div>
    </div>
  </div>

  <div class="container2">
    <div class="mode-controls">
      <label class="mode-control">
        <input id="switch" type="checkbox">
        <span class="slider round"></span>
        <span class="mode-text">무지개</span>
      </label>

      <label class="mode-control">
        <input id="switch2" type="checkbox">
        <span class="slider round"></span>
        <span class="mode-text">초무지개</span>
      </label>

      <label class="mode-control">
        <input id="check4" type="checkbox">
        <span class="slider round"></span>
        <span class="mode-text">레벨상한돌파</span>
      </label>

      <label class="mode-control">
        <input id="pirate-limit-switch" type="checkbox">
        <span class="slider round"></span>
        <span class="mode-text">해적제한돌</span>
      </label>

      <label class="mode-control">
        <input id="hide-legends" type="checkbox">
        <span class="slider round"></span>
        <span class="mode-text">목록에서 캐릭터 제거</span>
      </label>
    </div>

    <div class="counter-row global-counter-row" aria-label="전체 캐릭터 현황">
      <span id="counter2" class="counter-item"></span>
      <span id="rainbow" class="counter-item"></span>
      <span id="srainbow" class="counter-item"></span>
    </div>

      <div class="icon-container">
        <div class="featured-checklists">
          <section class="checklist-section" aria-labelledby="super-sugo-title">
            <h2 id="super-sugo-title" class="checklist-title">초스고 <small id="super-sugo-total" class="category-total"></small></h2>
            <div id="super-sugo" class="flair-grid"></div>
          </section>

          <section class="checklist-section" aria-labelledby="anniversary-sugo-title">
            <h2 id="anniversary-sugo-title" class="checklist-title">주년 스고 <small id="anniversary-sugo-total" class="category-total"></small></h2>
            <div id="anniversary-sugo" class="flair-grid"></div>
          </section>

          <section class="checklist-section" aria-labelledby="pirate-festival-sugo-title">
            <h2 id="pirate-festival-sugo-title" class="checklist-title">해적제 스고 <small id="pirate-festival-sugo-total" class="category-total"></small></h2>
            <div id="pirate-festival-sugo" class="flair-grid"></div>
          </section>

          <section class="checklist-section" aria-labelledby="treasure-map-sugo-title">
            <h2 id="treasure-map-sugo-title" class="checklist-title">트맵스고 <small id="treasure-map-sugo-total" class="category-total"></small></h2>
            <div id="treasure-map-sugo" class="flair-grid"></div>
          </section>
        </div>

        <section class="checklist-section regular-checklist" aria-labelledby="regular-sugo-title">
          <h2 id="regular-sugo-title" class="checklist-title">일반 스고 <small id="regular-sugo-total" class="category-total"></small></h2>
          <div id="special" class="flair-grid"></div>
        </section>
      </div>
  </div>

</body>

</html>
